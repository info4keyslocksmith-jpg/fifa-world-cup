<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrickWish</title>
<meta name="description" content="Tell us what you imagine. We design it, make a building manual just for you, and mail you the bricks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 30rem) on a studded baseplate. Sticky top bar with brick progress,
   fixed bottom bar with big Back / Next. One question per screen, numbered like a building-manual step. */
:root{
  --plate:#D9E9F7;        /* baseplate */
  --stud:#CFE1F3;
  --card:#FFFFFF;
  --callout:#EAF3FC;      /* the light-blue parts box of a building manual */
  --ink:#14203B;
  --ink-soft:#4B5A7A;
  --line:#BACDE4;
  --yellow:#FFC629;
  --on-yellow:#14203B;
  --red:#C8322D;
  --ok:#1C8A4E;
  --focus:#1F5FD1;
  --press:#14203B;
  --px-edge:rgba(20,32,59,.28);
  --empty-brick:#C3D3E6;
  --font-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plate:#0D1530; --stud:#121C3C; --card:#17213F; --callout:#1E2B52; --ink:#EEF3FF; --ink-soft:#AAB7D6;
    --line:#2E3C66; --yellow:#FFC629; --on-yellow:#14203B; --red:#FF7A75; --ok:#46D18A; --focus:#FFC629;
    --press:#04081A; --px-edge:rgba(238,243,255,.22); --empty-brick:#2E3C66; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plate:#0D1530; --stud:#121C3C; --card:#17213F; --callout:#1E2B52; --ink:#EEF3FF; --ink-soft:#AAB7D6;
  --line:#2E3C66; --yellow:#FFC629; --on-yellow:#14203B; --red:#FF7A75; --ok:#46D18A; --focus:#FFC629;
  --press:#04081A; --px-edge:rgba(238,243,255,.22); --empty-brick:#2E3C66; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--plate);
  background-image:radial-gradient(circle,var(--stud) 0 6px,transparent 6.5px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--font-body);font-size:1.125rem;line-height:1.5;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- bricks (one component reused for progress, sizes, swatches, wish card) ---------- */
.b{
  --c:var(--yellow);--w:44px;--h:20px;
  position:relative;display:inline-block;flex:none;width:var(--w);height:var(--h);margin-top:5px;
  background:var(--c);border-radius:3px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35),0 0 0 1px var(--px-edge);
}
.b::before{
  content:"";position:absolute;top:-5px;left:14%;width:22%;height:6px;background:var(--c);border-radius:2px 2px 0 0;
  box-shadow:calc(var(--w) * .5) 0 0 var(--c);
}
.b.empty{--c:var(--empty-brick);box-shadow:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--plate);border-bottom:2px solid var(--line)}
.topbar-in{max-width:30rem;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;cursor:pointer;
  font:800 1.35rem/1 var(--font-display);color:var(--ink);letter-spacing:-.01em}
.logo .b{--w:26px;--h:14px;margin-top:4px}
.progress{list-style:none;margin:0;padding:0;display:flex;gap:4px;align-items:flex-end;flex:1;justify-content:center}
.progress .b{--w:24px;--h:12px}
.progress[aria-hidden="true"]{visibility:hidden}
.lang{flex:none;min-width:52px;min-height:44px;border-radius:999px;border:2px solid var(--line);background:var(--card);
  font:700 .95rem/1 var(--font-body);cursor:pointer;letter-spacing:.04em}

/* ---------- screens ---------- */
.app{max-width:30rem;margin:0 auto;padding-inline:16px;padding-block:20px 150px}
.screen{display:flex;flex-direction:column;gap:18px;animation:enter .25s ease-out}
@keyframes enter{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.qhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.stepnum{font:800 3rem/1 var(--font-display);min-width:1.1ch;text-align:center;font-variant-numeric:tabular-nums}
.q{margin:0;font:800 clamp(1.7rem,7.2vw,2.15rem)/1.05 var(--font-display);text-wrap:balance}
.q:focus{outline:none}
.hint{margin:0;color:var(--ink-soft)}
.speak{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.speak svg{width:24px;height:24px}

/* ---------- buttons ---------- */
.btn{appearance:none;border:0;border-radius:14px;min-height:60px;padding:14px 22px;cursor:pointer;
  font:800 1.25rem/1.1 var(--font-display);color:var(--ink);background:var(--card);
  box-shadow:0 4px 0 var(--press);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.btn-primary{background:var(--yellow);color:var(--on-yellow)}
.btn-ghost{border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn-ghost:active{box-shadow:0 1px 0 var(--line)}
.btn[aria-disabled="true"]{opacity:.5}
.btn-xl{width:100%;min-height:72px;font-size:1.55rem}
.link{background:none;border:0;padding:10px 4px;cursor:pointer;color:var(--ink);font:600 1rem/1.3 var(--font-body);
  text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;align-self:center}

/* ---------- welcome ---------- */
.kicker{margin:0;font:600 .8rem/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft)}
.hero{margin:0;font:800 clamp(2.3rem,10.5vw,3rem)/1 var(--font-display);text-wrap:balance;letter-spacing:-.01em}
.lead{margin:0;font-size:1.1rem;max-width:34ch}
.showcase{display:flex;gap:14px;align-items:center}
.mosaic{flex:none;display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:min(150px,40vw);aspect-ratio:1;
  padding:8px;border-radius:14px;background:var(--callout);border:2px solid var(--line)}
.px{border-radius:2px;background:radial-gradient(circle,rgba(255,255,255,.16) 0 26%,rgba(0,0,0,.18) 29% 34%,transparent 37%),var(--c);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.16),0 0 0 1px var(--px-edge);animation:pop .35s both}
.px.none{background:none;box-shadow:none;animation:none}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.example{margin:0;min-width:0;display:flex;flex-direction:column;gap:4px}
.example figcaption{font:600 .78rem/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.example-wish{margin:0;font:700 1.2rem/1.2 var(--font-display)}
.example-meta{margin:0;font-size:.85rem;color:var(--ink-soft)}
.welcome-actions{display:flex;flex-direction:column;gap:12px}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.how li{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.9rem;line-height:1.2;
  padding:12px 6px;background:var(--card);border:2px solid var(--line);border-radius:var(--radius)}
.how-n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--plate);
  font:800 1.1rem/1 var(--font-display)}

/* ---------- step 1: what ---------- */
.wish-input{width:100%;min-height:96px;padding:14px 16px;resize:none;border:3px solid var(--line);border-radius:var(--radius);
  background:var(--card);font:600 1.4rem/1.3 var(--font-body)}
.wish-input:focus{outline:none;border-color:var(--focus)}
.wish-input::placeholder{color:var(--ink-soft);opacity:.75}
.note{margin:-8px 0 0;font-size:.85rem;color:var(--ink-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dice{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:10px 16px;border-radius:999px;cursor:pointer;
  border:2px solid var(--line);background:var(--card);font:700 1rem/1 var(--font-body)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;
  padding:10px 6px;border:3px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;
  font:600 .95rem/1.15 var(--font-body);text-align:center}
.chip .emo{font-size:2.2rem;line-height:1}
.chip.wide{flex-direction:row;justify-content:flex-start;gap:10px;min-height:64px;padding:10px 12px;text-align:left}
.chip.wide .emo{font-size:1.8rem}
.chip[aria-pressed="true"],.opt.on{border-color:var(--ink);background:var(--callout);box-shadow:inset 0 0 0 2px var(--ink)}
.chip[aria-pressed="true"]::after,.opt.on::after{content:"✓";position:absolute;top:-10px;right:-8px;width:28px;height:28px;
  display:grid;place-items:center;border-radius:50%;background:var(--yellow);color:var(--on-yellow);font:800 1rem/1 var(--font-body);
  box-shadow:0 0 0 2px var(--ink)}

/* ---------- step 3: colors ---------- */
.swatch{gap:8px;min-height:84px;padding:14px 4px 8px;font-size:.8rem}
.swatch .b{--w:46px;--h:22px}
.suggested{margin:0;padding:10px 12px;border-radius:12px;background:var(--callout);font-size:.95rem}

/* ---------- step 4/5: options ---------- */
.opt{position:relative;display:flex;border:3px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}
.age{flex-direction:column;gap:4px;padding:14px}
.age-num{font:800 2.2rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.age-desc{font-size:.95rem;line-height:1.2}
.level{display:flex;gap:3px;margin-top:6px}
.level .b{--w:22px;--h:11px}
.tiers{display:flex;flex-direction:column;gap:12px}
.tier{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.stack{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;min-height:104px}
.stack .b{--w:46px;--h:20px;margin-top:4px}
.stack .b:nth-child(even){transform:translateX(7px)}
.tier-name{display:block;font:800 1.45rem/1 var(--font-display)}
.tier-pcs{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.tier-time{display:block;font-size:.85rem;color:var(--ink-soft);line-height:1.25}
.tier-price{font:800 1.3rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:var(--ok);color:#fff;font:700 .75rem/1.3 var(--font-body)}

/* ---------- step 6: wish card ---------- */
.wishcard{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--card);border:3px solid var(--ink);
  border-radius:20px;box-shadow:0 6px 0 var(--ink)}
.stage{display:flex;flex-direction:column-reverse;align-items:center;min-height:118px;padding:12px 0 10px;border-radius:12px;background:var(--callout)}
.stage-row{display:flex;gap:3px}
.stage .b{--w:62px;--h:26px;margin-top:6px;animation:drop .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
.wc-label{margin:0;font:600 .78rem/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.wc-wish{margin:-6px 0 0;font:800 1.8rem/1.05 var(--font-display);overflow-wrap:anywhere}
.parts{margin:0;display:grid;gap:6px}
.parts div{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--callout)}
.parts dt{font-size:.85rem;color:var(--ink-soft)}
.parts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.mini-swatches{display:flex;gap:6px;flex-wrap:wrap}
.mini-swatches .b{--w:30px;--h:14px}

/* ---------- forms (gate, checkout) ---------- */
.panel{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--card);border:2px solid var(--line);border-radius:var(--radius)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600}
.field .help{font-size:.85rem;color:var(--ink-soft)}
.input{width:100%;min-height:56px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.15rem}
.input:focus{outline:none;border-color:var(--focus)}
.input.big{font:800 2rem/1 var(--font-display);text-align:center;letter-spacing:.06em}
.check{display:flex;gap:12px;align-items:flex-start;font-size:1rem;cursor:pointer}
.check input{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--ink)}
.err{margin:0;color:var(--red);font-weight:600;font-size:.95rem}
.err:empty{display:none}
.gate-q{margin:0;font:800 2.2rem/1.1 var(--font-display);text-align:center}
.summary{display:grid;gap:4px}
.sum-row{display:flex;justify-content:space-between;gap:12px}
.sum-row span:first-child{min-width:0;overflow-wrap:anywhere}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:2px dashed var(--line);
  font:800 1.5rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft);font-size:.9rem;margin:0}
.warn{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;font-size:.9rem;line-height:1.35}
.warn svg{flex:none;width:30px;height:27px}
.warn strong{font-weight:700}
.demo{margin:0;padding:8px 12px;border-radius:10px;background:var(--callout);font-size:.85rem}

/* ---------- done ---------- */
.code{display:inline-block;align-self:flex-start;padding:10px 16px;border-radius:12px;background:var(--yellow);color:var(--on-yellow);
  font:800 1.8rem/1 var(--font-display);letter-spacing:.08em;box-shadow:0 4px 0 var(--press)}
.timeline{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:t}
.timeline li{counter-increment:t;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;
  padding:10px 12px;background:var(--card);border:2px solid var(--line);border-radius:12px}
.timeline li::before{content:counter(t);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;
  background:var(--ink);color:var(--plate);font:800 1.1rem/1 var(--font-display)}

/* ---------- grown-ups ---------- */
.info h3{margin:0 0 6px;font:800 1.35rem/1.1 var(--font-display)}
.info section{display:flex;flex-direction:column;gap:6px}
.info ul,.info ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.info p{margin:0}
.table-wrap{overflow-x:auto}
.prices{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.prices th,.prices td{text-align:left;padding:10px 8px;border-bottom:2px solid var(--line)}
.prices th{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.prices td:last-child,.prices th:last-child{text-align:right}
details{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px}
summary{cursor:pointer;padding:12px 0;font-weight:600}
details p{padding-bottom:12px}
.fineprint{font-size:.8rem;color:var(--ink-soft)}

/* ---------- bottom bar + toast ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bottombar-in{max-width:30rem;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
.bottombar-in .btn-primary:only-child{grid-column:1 / -1}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;
  width:max-content;max-width:calc(100% - 32px);margin:0;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--plate);
  font-weight:600;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="logo" id="logoBtn" type="button"><span class="b" aria-hidden="true"></span><span>BrickWish</span></button>
    <ol class="progress" id="progress"></ol>
    <button class="lang" id="langBtn" type="button">ES</button>
  </div>
</header>

<main class="app" id="main">

  <!-- Welcome -->
  <section class="screen" id="s-welcome">
    <p class="kicker" data-t="welcomeKicker"></p>
    <h1 class="hero q" tabindex="-1" data-t="welcomeTitle"></h1>
    <p class="lead" data-t="welcomeLead"></p>
    <div class="showcase">
      <div class="mosaic" id="mosaic" role="img" data-t-aria="mosaicAlt"></div>
      <figure class="example">
        <figcaption data-t="exampleLabel"></figcaption>
        <p class="example-wish" data-t="exampleWish"></p>
        <p class="example-meta" data-t="exampleMeta"></p>
      </figure>
    </div>
    <div class="welcome-actions">
      <button class="btn btn-primary btn-xl" id="startBtn" type="button" data-t="start"></button>
      <button class="link" id="restartBtn" type="button" data-t="startOver" hidden></button>
    </div>
    <ol class="how">
      <li><span class="how-n">1</span><span data-t="how1"></span></li>
      <li><span class="how-n">2</span><span data-t="how2"></span></li>
      <li><span class="how-n">3</span><span data-t="how3"></span></li>
    </ol>
    <button class="link" id="infoBtn" type="button" data-t="forGrownups"></button>
  </section>

  <!-- 1. What -->
  <section class="screen" id="s-what" hidden>
    <div class="qhead"><span class="stepnum" aria-hidden="true">1</span><h2 class="q" tabindex="-1" data-t="q_what"></h2><button class="speak" type="button" data-t-aria="readAloud"></button></div>
    <p class="hint" data-t="h_what"></p>
    <label class="sr-only" for="wishInput" data-t="wishLabel"></label>
    <textarea class="wish-input" id="wishInput" rows="2" maxlength="140" autocomplete="off" data-t-ph="wishPh"></textarea>
    <p class="note" data-t="wishNote"></p>
    <div class="row"><button class="dice" id="diceBtn" type="button"><span aria-hidden="true">🎲</span><span data-t="dice"></span></button></div>
    <div class="grid3" id="subjects"></div>
  </section>

  <!-- 2. Extras -->
  <section class="screen" id="s-extras" hidden>
    <div class="qhead"><span class="stepnum" aria-hidden="true">2</span><h2 class="q" tabindex="-1" data-t="q_extras"></h2><button class="speak" type="button" data-t-aria="readAloud"></button></div>
    <p class="hint" data-t="h_extras"></p>
    <div class="grid2" id="extras"></div>
  </section>

  <!-- 3. Colors -->
  <section class="screen" id="s-colors" hidden>
    <div class="qhead"><span class="stepnum" aria-hidden="true">3</span><h2 class="q" tabindex="-1" data-t="q_colors"></h2><button class="speak" type="button" data-t-aria="readAloud"></button></div>
    <p class="hint" data-t="h_colors"></p>
    <p class="suggested" id="suggested" data-t="suggested" hidden></p>
    <div class="grid4" id="colors"></div>
    <button class="chip wide" id="surpriseBtn" type="button" aria-pressed="false"><span class="emo" aria-hidden="true">🎁</span><span data-t="surpriseChip"></span></button>
  </section>

  <!-- 4. Age -->
  <section class="screen" id="s-age" hidden>
    <div class="qhead"><span class="stepnum" aria-hidden="true">4</span><h2 class="q" tabindex="-1" data-t="q_age" id="ageQ"></h2><button class="speak" type="button" data-t-aria="readAloud"></button></div>
    <p class="hint" data-t="h_age"></p>
    <div class="grid2" id="ages" role="radiogroup" aria-labelledby="ageQ"></div>
  </section>

  <!-- 5. Size -->
  <section class="screen" id="s-size" hidden>
    <div class="qhead"><span class="stepnum" aria-hidden="true">5</span><h2 class="q" tabindex="-1" data-t="q_size" id="sizeQ"></h2><button class="speak" type="button" data-t-aria="readAloud"></button></div>
    <p class="hint" data-t="h_size"></p>

  ip2: "Sin anuncios, sin cookies de rastreo, sin cuentas y sin chat.", ip3: "Usamos su correo solo para este pedido y la aprobación del diseño.",
  infoFaq: "Preguntas",
  fq1: "¿Cuánto tarda?", fa1: "Unos 7 a 10 días: 2 días de diseño, su aprobación, y luego empaque y envío.",
  fq2: "¿Podemos ver el diseño antes del envío?", fa2: "Sí. Le enviamos un boceto por correo y solo empacamos el kit cuando usted lo aprueba.",
  fq3: "¿Y si falta una pieza?", fa3: "Cada kit trae piezas pequeñas de repuesto. Si aun así falta algo, se la enviamos gratis.",
  fq4: "¿Los bloques sirven con otras marcas?", fa4: "Sí. Nuestros bloques son compatibles con los bloques LEGO® y con la mayoría de las otras marcas de bloques.",
  fineprint: "BrickWish es una empresa independiente. LEGO® es una marca registrada del Grupo LEGO, que no patrocina, autoriza ni respalda este sitio. Bloques hechos en China, diseñados y empacados en EE. UU.",
  subjects: { dog:"Perro", cat:"Gato", dino:"Dinosaurio", unicorn:"Unicornio", dragon:"Dragón", shark:"Tiburón", rocket:"Cohete",
              racecar:"Carro de carreras", train:"Tren", castle:"Castillo", robot:"Robot", house:"Casa" },
  extras: { crown:"Corona", sunglasses:"Lentes de sol", wings:"Alas", rainbow:"Arcoíris", fire:"Fuego", treasure:"Tesoro",
            flowers:"Flores", friend:"Amiguito" },
  colors: { red:"Rojo", orange:"Naranja", yellow:"Amarillo", green:"Verde", blue:"Azul", purple:"Morado", pink:"Rosado",
            brown:"Café", tan:"Beige", gray:"Gris", white:"Blanco", black:"Negro" },
  ages: { "4-6":"Pasos grandes y fáciles", "7-9":"Un reto divertido", "10-12":"Constructor de verdad", "13+":"Maestro constructor" },
  tiers: { mini:["Mini","Unos 30 minutos de construcción"], medium:["Mediano","Como 1 hora de construcción"],
           big:["Grande","De 2 a 3 horas de construcción"], mega:["Mega","Un proyecto de fin de semana"] },
  ideas: ["una tortuga astronauta", "un dragón que reparte pizza", "un perro robot con propulsores", "un castillo sobre una nube",
          "un tiburón en patineta", "un camión de helados para pingüinos", "una casa del árbol con tobogán", "un camión de bomberos unicornio"],
}};

/* ===== State ===== */
const KEY = "brickwish.wish.v1";
const blank = () => ({ wish: "", extras: [], colors: [], colorsTouched: false, surprise: false, age: null, size: null });
const state = Object.assign({ lang: "en", screen: "welcome", infoFrom: "welcome", gatePassed: false, code: "" }, blank());
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && typeof saved === "object") {
    for (const k of ["wish", "extras", "colors", "colorsTouched", "surprise", "age", "size", "lang"]) if (k in saved) state[k] = saved[k];
  } else if ((navigator.language || "").toLowerCase().startsWith("es")) state.lang = "es";
} catch (e) { /* storage blocked: start fresh */ }
function save() {
  // Only the wish itself is remembered on this device. Name and email are never stored.
  try {
    const { wish, extras, colors, colorsTouched, surprise, age, size, lang } = state;
    localStorage.setItem(KEY, JSON.stringify({ wish, extras, colors, colorsTouched, surprise, age, size, lang }));
  } catch (e) { /* ignore */ }
}

/* ===== Helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const t = (k) => (T[state.lang][k] ?? T.en[k] ?? k);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const brick = (hex, cls = "") => `<span class="b ${cls}"${hex ? ` style="--c:${hex}"` : ""} aria-hidden="true"></span>`;
const money = (n) => "$" + n;
const tierOf = (id) => TIERS.find((x) => x.id === id);
const ageOf = (id) => AGES.find((x) => x.id === id);
const artColors = () => (state.colors.length ? state.colors : ["red", "blue", "yellow", "green"]).map((c) => HEX[c]);
let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
function suggestColors(text) {
  const n = norm(text), out = [];
  for (const [re, c] of COLOR_WORDS) if (re.test(n) && !out.includes(c)) out.push(c);
  for (const [re, list] of SUBJECT_COLORS) if (re.test(n)) { for (const c of list) if (!out.includes(c)) out.push(c); break; }
  return out.slice(0, 4);
}
/* Removes emails, phone numbers, web links and street addresses a child may have typed into the wish. */
function scrub(text) {
  return text
    .replace(/[^\s@]+@[^\s@]+\.[^\s@]+/g, "[removed]")
    .replace(/(https?:\/\/|www\.)\S+/gi, "[removed]")
    .replace(/\+?\d[\d\s().-]{6,}\d/g, "[removed]")
    .replace(/\b\d{1,6}\s+(?:[A-Za-zÀ-ÿ]+\s){0,3}(?:st|street|ave|avenue|rd|road|blvd|dr|drive|ln|lane|ct|calle|avenida)\b\.?/gi, "[removed]");
}
function makeCode() {
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s = "BW-";
  const r = new Uint32Array(5); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(r) : r.forEach((_, i) => r[i] = Math.random() * 1e9);
  r.forEach((v) => s += A[v % A.length]); return s;
}

/* ===== Speech (reads the question aloud for early readers; no microphone, nothing recorded) ===== */
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang === "es" ? "es-US" : "en-US"; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) { /* not available */ }
}
const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
$$(".speak").forEach((b) => {
  b.innerHTML = SPEAKER; b.hidden = !canSpeak;
  b.addEventListener("click", () => {
    const sec = b.closest(".screen");
    speak($(".q", sec).textContent + ". " + ($(".hint", sec)?.textContent || ""));
  });
});

/* ===== Builders for lists (rebuilt when the language changes) ===== */
function buildLists() {
  const L = T[state.lang];
  $("#subjects").innerHTML = SUBJECTS.map(([id, e]) =>
    `<button class="chip" type="button" data-subject="${id}" aria-pressed="false"><span class="emo" aria-hidden="true">${e}</span><span>${L.subjects[id]}</span></button>`).join("");
  $("#extras").innerHTML = EXTRAS.map(([id, e]) =>
    `<button class="chip wide" type="button" data-extra="${id}" aria-pressed="false"><span class="emo" aria-hidden="true">${e}</span><span>${L.extras[id]}</span></button>`).join("");
  $("#colors").innerHTML = COLORS.map(([id, hex]) =>
    `<button class="chip swatch" type="button" data-color="${id}" aria-pressed="false">${brick(hex)}<span>${L.colors[id]}</span></button>`).join("");
  $("#ages").innerHTML = AGES.map((a) =>
    `<label class="opt age"><input type="radio" name="age" value="${a.id}"><span class="age-num">${a.label}</span><span class="age-desc">${L.ages[a.id]}</span>` +
    `<span class="level" aria-hidden="true">${[1,2,3,4].map((i) => brick(i <= a.level ? "var(--yellow)" : "", i <= a.level ? "" : "empty")).join("")}</span></label>`).join("");
  $("#tiers").innerHTML = TIERS.map((x) =>
    `<label class="opt tier" data-tier="${x.id}"><input type="radio" name="size" value="${x.id}"><span class="stack" aria-hidden="true"></span>` +
    `<span><span class="tier-name">${L.tiers[x.id][0]}</span><span class="tier-pcs">${x.pcs} ${L.pieces}</span>` +
    `<span class="tier-time">${L.tiers[x.id][1]}</span><span class="badge" hidden>${L.bestBadge}</span></span>` +
    `<span class="tier-price">${money(x.price)}</span></label>`).join("");
  $("#priceRows").innerHTML = TIERS.map((x) => `<tr><td>${L.tiers[x.id][0]}</td><td>${x.pcs}</td><td>${money(x.price)}</td></tr>`).join("");
}
function buildMosaic() {
  const el = $("#mosaic");
  el.innerHTML = DALMATIAN.map((row, r) => [...row].map((ch, c) => ch === "."
    ? '<i class="px none"></i>'
    : `<i class="px" style="--c:${PX[ch]};animation-delay:${r * 45 + c * 10}ms"></i>`).join("")).join("");
}

/* ===== Navigation ===== */
const SCREENS = ["welcome", "what", "extras", "colors", "age", "size", "review", "gate", "checkout", "done", "info"];
const STEPS = ["what", "extras", "colors", "age", "size"];
const NAV = {
  what:   { back: "welcome", next: "extras", req: () => state.wish.trim().length >= 2, need: "need_what" },
  extras: { back: "what",    next: "colors" },
  colors: { back: "extras",  next: "age" },
  age:    { back: "colors",  next: "size", req: () => !!state.age, need: "need_age" },
  size:   { back: "age",     next: "review", req: () => !!state.size, need: "need_size" },
  review: { back: "size",    next: "gate" },
  gate:   { back: "review" },
  checkout: { back: "review" },
  info:   { back: "@from",   next: "what" },
};
function nextLabel(s) {
  if (s === "extras") return state.extras.length ? t("next") : t("skip");
  if (s === "colors") return state.colors.length || state.surprise ? t("next") : t("surpriseNext");
  if (s === "review") return t("askGrownup");
  if (s === "info") return t("infoStart");
  return t("next");
}
function go(id, opts = {}) {
  if (id === "checkout" && !state.gatePassed) id = "gate";
  if (id === "colors" && !state.colorsTouched && !state.colors.length && !state.surprise) {
    state.colors = suggestColors(state.wish); state.showSuggested = state.colors.length > 0;
  }
  if (id === "gate") newGate();
  if (id === "info" && state.screen !== "info") state.infoFrom = state.screen;
  state.screen = id;
  $("#toast").hidden = true;
  for (const s of SCREENS) $("#s-" + s).hidden = s !== id;
  render();
  window.scrollTo(0, 0);
  if (opts.focus !== false) $("#s-" + id + " .q")?.focus({ preventScroll: true });
  if (opts.push !== false) { try { history.pushState({ s: id }, ""); } catch (e) { /* ignore */ } }
  save();
}
window.addEventListener("popstate", (e) => {
  const s = e.state && e.state.s;
  if (s && SCREENS.includes(s)) go(s, { push: false });
});

/* ===== Render ===== */
function render() {
  const s = state.screen, L = T[state.lang];

  // progress bricks
  const pi = STEPS.indexOf(s), inWizard = pi >= 0 || s === "review";
  const prog = $("#progress");
  prog.setAttribute("aria-hidden", inWizard ? "false" : "true");
  prog.setAttribute("aria-label", t("progress"));
  const PROG = ["#C91A09", "#0055BF", "#F2CD37", "#237841", "#FE8A18"];
  prog.innerHTML = STEPS.map((_, i) => {
    const done = s === "review" || i <= pi;
    return `<li>${done ? brick(PROG[i]) : brick("", "empty")}</li>`;
  }).join("");

  // welcome
  const hasDraft = state.wish.trim().length > 0;
  $("#startBtn").textContent = hasDraft ? t("continueWish") : t("start");
  $("#restartBtn").hidden = !hasDraft;

  // what
  const wi = $("#wishInput"); if (wi.value !== state.wish) wi.value = state.wish;
  const nw = norm(state.wish.trim());
  $$("#subjects .chip").forEach((b) => b.setAttribute("aria-pressed", String(nw === norm(L.subjects[b.dataset.subject]))));

  // extras
  $$("#extras .chip").forEach((b) => b.setAttribute("aria-pressed", String(state.extras.includes(b.dataset.extra))));

  // colors
  $$("#colors .chip").forEach((b) => b.setAttribute("aria-pressed", String(state.colors.includes(b.dataset.color))));
  $("#surpriseBtn").setAttribute("aria-pressed", String(state.surprise));
  $("#suggested").hidden = !state.showSuggested;

  // age
  $$("#ages .opt").forEach((l) => { const i = $("input", l); i.checked = i.value === state.age; l.classList.toggle("on", i.checked); });

  // size
  const best = state.age ? ageOf(state.age).best : [];
  const cols = artColors();
  $$("#tiers .opt").forEach((l) => {
    const i = $("input", l), tier = tierOf(i.value);
    i.checked = i.value === state.size; l.classList.toggle("on", i.checked);
    $(".badge", l).hidden = !best.includes(i.value);
    $(".stack", l).innerHTML = Array.from({ length: tier.bricks }, (_, k) => brick(cols[k % cols.length])).join("");
  });

  // review
  if (s === "review") renderCard();

  // checkout
  if (s === "checkout") {
    const tier = tierOf(state.size), age = ageOf(state.age);
    $("#coWish").textContent = cap(state.wish.trim());
    $("#coSummary").innerHTML =
      `<div class="sum-row"><span>${L.tiers[tier.id][0]} · ${tier.pcs} ${L.pieces}</span><span>${money(tier.price)}</span></div>` +
      `<div class="sum-row muted"><span>${t("lbl_builder")}: ${age.label} · ${L.ages[age.id]}</span><span></span></div>`;
    $("#coTotal").textContent = money(tier.price);
    $("#demoNote").hidden = !CONFIG.demo;
  }

  // gate question text follows the language
  if (s === "gate") $("#gateQ").textContent = t("gateQ").replace("{a}", gate.a).replace("{b}", gate.b);

  if (s === "done") $("#doneCode").textContent = state.code;

  renderNav();
}
const cap = (x) => x ? x[0].toUpperCase() + x.slice(1) : x;
function renderCard() {
  const L = T[state.lang], tier = tierOf(state.size), age = ageOf(state.age), cols = artColors();
  $("#wcWish").textContent = cap(state.wish.trim());
  $("#wcExtras").textContent = state.extras.length ? state.extras.map((e) => L.extras[e]).join(", ") : t("none");
  $("#wcColors").innerHTML = state.colors.length
    ? `<span class="mini-swatches">${state.colors.map((c) => brick(HEX[c])).join("")}</span><span class="sr-only">${state.colors.map((c) => L.colors[c]).join(", ")}</span>`
    : t("surpriseColors");
  $("#wcAge").textContent = `${age.label} · ${L.ages[age.id]}`;
  $("#wcSize").textContent = `${L.tiers[tier.id][0]} · ${tier.pcs} ${L.pieces}`;
  let k = 0;
  $("#stage").innerHTML = [3, 2, 1].map((n, row) =>
    `<div class="stage-row">${Array.from({ length: n }, () => {
      const html = `<span class="b" style="--c:${cols[k % cols.length]};animation-delay:${k * 120}ms" aria-hidden="true"></span>`; k++; return html;
    }).join("")}</div>`).join("");
}
function renderNav() {
  const s = state.screen, nav = NAV[s], bar = $("#bottombar");
  bar.hidden = !nav;
  if (!nav) return;
  $("#backBtn").textContent = t("back");
  const nb = $("#nextBtn");
  nb.hidden = !nav.next;
  if (nav.next) {
    nb.textContent = nextLabel(s);
    nb.setAttribute("aria-disabled", nav.req && !nav.req() ? "true" : "false");
  }
}

/* ===== i18n ===== */
function applyLang() {
  document.documentElement.lang = state.lang;
  $$("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  $$("[data-t-ph]").forEach((el) => { el.placeholder = t(el.dataset.tPh); });
  $$("[data-t-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.tAria)); });
  const lb = $("#langBtn"); lb.textContent = t("langBtn"); lb.setAttribute("aria-label", t("langAria"));
  $("#logoBtn").setAttribute("aria-label", t("home"));
  buildLists(); render();
}

/* ===== Events ===== */
$("#langBtn").addEventListener("click", () => { state.lang = state.lang === "en" ? "es" : "en"; applyLang(); save(); });
$("#logoBtn").addEventListener("click", () => go("welcome"));
$("#startBtn").addEventListener("click", () => go("what"));
$("#restartBtn").addEventListener("click", () => { Object.assign(state, blank(), { showSuggested: false }); go("what"); });
$("#infoBtn").addEventListener("click", () => go("info"));
$("#editBtn").addEventListener("click", () => go("what"));
$("#againBtn").addEventListener("click", () => { Object.assign(state, blank(), { showSuggested: false, gatePassed: false, code: "" }); go("what"); });

$("#backBtn").addEventListener("click", () => {
  const nav = NAV[state.screen];
  go(nav.back === "@from" ? (state.infoFrom || "welcome") : nav.back);
});
$("#nextBtn").addEventListener("click", () => {
  const s = state.screen, nav = NAV[s];
  if (nav.req && !nav.req()) { toast(t(nav.need)); return; }
  if (s === "colors" && !state.colors.length) state.surprise = true;
  go(nav.next);
});

$("#wishInput").addEventListener("input", (e) => {
  state.wish = e.target.value;
  if (!state.colorsTouched) { state.colors = []; state.surprise = false; state.showSuggested = false; }
  render(); save();
});
$("#diceBtn").addEventListener("click", () => {
  const ideas = T[state.lang].ideas.filter((x) => x !== state.wish);
  state.wish = ideas[Math.floor(Math.random() * ideas.length)];
  if (!state.colorsTouched) { state.colors = []; state.surprise = false; }
  render(); save();
});
$("#subjects").addEventListener("click", (e) => {
  const b = e.target.closest("[data-subject]"); if (!b) return;
  state.wish = T[state.lang].subjects[b.dataset.subject];
  if (!state.colorsTouched) { state.colors = []; state.surprise = false; }
  render(); save();
});
$("#extras").addEventListener("click", (e) => {
  const b = e.target.closest("[data-extra]"); if (!b) return;
  const id = b.dataset.extra, i = state.extras.indexOf(id);
  i >= 0 ? state.extras.splice(i, 1) : state.extras.push(id);
  render(); save();
});
$("#colors").addEventListener("click", (e) => {
  const b = e.target.closest("[data-color]"); if (!b) return;
  const id = b.dataset.color, i = state.colors.indexOf(id);
  if (i >= 0) state.colors.splice(i, 1);
  else if (state.colors.length >= 4) { toast(t("maxColors")); return; }
  else state.colors.push(id);
  state.colorsTouched = true; state.surprise = false; state.showSuggested = false;
  render(); save();
});
$("#surpriseBtn").addEventListener("click", () => {
  state.surprise = !state.surprise;
  if (state.surprise) state.colors = [];
  state.colorsTouched = true; state.showSuggested = false;
  render(); save();
});
$("#ages").addEventListener("change", (e) => { state.age = e.target.value; render(); save(); });
$("#tiers").addEventListener("change", (e) => { state.size = e.target.value; render(); save(); });

/* Parent gate: a times-table question most young kids can't answer yet. */
const gate = { a: 7, b: 8, tries: 0 };
function newGate() {
  gate.a = 6 + Math.floor(Math.random() * 4); gate.b = 6 + Math.floor(Math.random() * 4); gate.tries = 0;
  $("#gateInput").value = ""; $("#gateErr").textContent = "";
}
$("#gateForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (parseInt($("#gateInput").value, 10) === gate.a * gate.b) { state.gatePassed = true; go("checkout"); return; }
  gate.tries++;
  if (gate.tries >= 3) { newGate(); render(); $("#gateErr").textContent = t("gateNew"); }
  else { $("#gateErr").textContent = t("gateWrong"); $("#gateInput").select(); }
});

/* Checkout */
$("#coForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("#emailInput").value.trim(), adult = $("#adultInput").checked;
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
  $("#emailErr").textContent = emailOk ? "" : t("emailErr");
  $("#adultErr").textContent = adult ? "" : t("adultErr");
  if (!emailOk) { $("#emailInput").focus(); return; }
  if (!adult) { $("#adultInput").focus(); return; }

  state.code = makeCode();
  const order = {
    code: state.code, wish: scrub(state.wish.trim()), extras: state.extras, colors: state.colors, surpriseColors: state.surprise,
    age: state.age, size: state.size, price: tierOf(state.size).price, builderFirstName: $("#nameInput").value.trim(),
    email, lang: state.lang, createdAt: new Date().toISOString(),
  };
  if (!CONFIG.demo) {
    if (CONFIG.orderEndpoint) {
      try { await fetch(CONFIG.orderEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order) }); }
      catch (err) { /* payment still goes through; the code links the two */ }
    }
    const link = CONFIG.checkoutLinks[state.size];
    if (link) {
      location.href = `${link}?client_reference_id=${encodeURIComponent(order.code)}&prefilled_email=${encodeURIComponent(email)}`;
      return;
    }
  }
  $("#coForm").reset();
  go("done");
});

/* ===== Start ===== */
buildMosaic();
applyLang();
try { history.replaceState({ s: "welcome" }, ""); } catch (e) { /* ignore */ }
for (const s of SCREENS) $("#s-" + s).hidden = s !== "welcome";
render();
})();
</script>
</body>
</html>
